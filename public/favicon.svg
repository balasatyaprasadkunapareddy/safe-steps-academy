<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Main Shield -->
  <path d="M50 6 L86 20 V48 C86 70 69 88 50 94 C31 88 14 70 14 48 V20 Z" fill="url(#shieldGrad)" />
  <!-- White Inner Shield Border -->
  <path d="M50 13 L80 25 V48 C80 66 66 81 50 86 C34 81 20 66 20 48 V25 Z" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5" fill="none" />
  <!-- Safety Check Mark -->
  <path d="M34 49 L45 60 L67 36" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Caution Star / Beacon Dot -->
  <circle cx="50" cy="26" r="4.5" fill="url(#starGrad)" />
</svg>
